<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POO Dashboard PRO - Jerónimo</title>

<style>
:root{--bg:#000;--text:#e2e8f0;--primary:#38bdf8;--card:#0f172a}
body{margin:0;font-family:'Segoe UI';background:var(--bg);color:var(--text)}
section{padding:50px 20px;max-width:1200px;margin:auto}
h1,h2{color:var(--primary)}
.card{background:var(--card);padding:20px;border-radius:12px;margin:15px 0;box-shadow:0 0 20px rgba(56,189,248,0.2)}
input,button{padding:10px;margin:5px;border:none;border-radius:5px}
button{background:var(--primary);cursor:pointer}
.hidden{display:none}
.item{padding:10px;border-bottom:1px solid #333}
</style>
</head>

<body>

<section id="loginSection">
<h1>🔐 Login Sistema Biblioteca</h1>
<div class="card">
<input id="loginUser" placeholder="Usuario">
<button onclick="login()">Ingresar</button>
</div>
</section>

<section id="dashboard" class="hidden">
<h1>📊 Dashboard Biblioteca</h1>

<div class="card">
<h2>🧠 Nota Programación I</h2>
<p>Clases, Objetos, Encapsulamiento, Herencia, Polimorfismo, Abstracción, ArrayList.</p>
</div>

<div class="card">
<h2>👤 Usuarios</h2>
<input id="userName" placeholder="Nombre usuario">
<button onclick="addUser()">Agregar</button>
<div id="users"></div>
</div>

<div class="card">
<h2>📚 Libros</h2>
<input id="bookName" placeholder="Nombre libro">
<button onclick="addBook()">Agregar</button>
<input id="search" placeholder="Buscar libro" oninput="render()">
<div id="books"></div>
</div>

<div class="card">
<h2>🌐 Deploy</h2>
<p>Sube este archivo como index.html a GitHub y activa Pages.</p>
</div>

<button onclick="logout()">Cerrar sesión</button>
</section>

<script>
let users = JSON.parse(localStorage.getItem('users')) || [];
let books = JSON.parse(localStorage.getItem('books')) || [];

function login(){
 let user = document.getElementById('loginUser').value;
 if(user){
  localStorage.setItem('session', user);
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
 }
}

function logout(){
 localStorage.removeItem('session');
 location.reload();
}

function save(){
 localStorage.setItem('users', JSON.stringify(users));
 localStorage.setItem('books', JSON.stringify(books));
 render();
}

function addUser(){
 let name = document.getElementById('userName').value;
 if(name){ users.push({name}); save(); }
}

function addBook(){
 let name = document.getElementById('bookName').value;
 if(name){ books.push({name, disponible:true}); save(); }
}

function prestar(i){
 books[i].disponible = false;
 save();
}

function render(){
 let uDiv = document.getElementById('users');
 let bDiv = document.getElementById('books');
 let search = document.getElementById('search').value.toLowerCase();

 uDiv.innerHTML='';
 users.forEach(u=>{
  uDiv.innerHTML += `<div class='item'>${u.name}</div>`;
 });

 bDiv.innerHTML='';
 books.filter(b=>b.name.toLowerCase().includes(search)).forEach((b,i)=>{
  bDiv.innerHTML += `<div class='item'>${b.name} - ${b.disponible?'Disponible':'Prestado'} <button onclick='prestar(${i})'>Prestar</button></div>`;
 });
}

if(localStorage.getItem('session')){
 document.getElementById('loginSection').classList.add('hidden');
 document.getElementById('dashboard').classList.remove('hidden');
}

render();
</script>

</body>
</html>
