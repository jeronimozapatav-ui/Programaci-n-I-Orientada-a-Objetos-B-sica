<!DOCTYPE html>
<html>
<head>
    <title>Mi página</title>

    <!-- Librería para convertir Markdown a HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: Arial;
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
    </style>
</head>

<body>

<h1>Mi Proyecto 📘</h1>

<div id="contenido">Cargando README...</div>

<script>
fetch("README.md")
    .then(response => response.text())
    .then(texto => {
        document.getElementById("contenido").innerHTML = marked.parse(texto);
    })
    .catch(error => {
        document.getElementById("contenido").innerHTML = "Error cargando el README 😢";
        console.error(error);
    });
</script>

</body>
</html>
