<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POO App Nivel Dios - Jerónimo</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{--bg:#000;--text:#e2e8f0;--primary:#38bdf8;--card:#0f172a}
.light{--bg:#f8fafc;--text:#000;--card:#fff}
body{margin:0;font-family:'Segoe UI';background:var(--bg);color:var(--text);display:flex;transition:.3s}

.sidebar{width:220px;background:#020617;height:100vh;padding:20px;position:fixed}
.sidebar a{display:block;color:white;margin:10px 0;text-decoration:none}

.main{margin-left:240px;padding:20px;width:100%}
.card{background:var(--card);padding:20px;border-radius:12px;margin:15px 0}
button{background:var(--primary);padding:10px;border:none;border-radius:5px;cursor:pointer}
input{padding:10px;margin:5px;border:none;border-radius:5px}

@media(max-width:768px){
 .sidebar{position:relative;width:100%;height:auto}
 .main{margin-left:0}
}
</style>
</head>

<body>

<div class="sidebar">
<h2>📊 Panel</h2>
<a href="#">Inicio</a>
<button onclick="toggleMode()">Modo</button>
</div>

<div class="main">

<div class="card">
<h2>👤 Login</h2>
<input id="user" placeholder="Usuario">
<select id="role">
<option value="admin">Admin</option>
<option value="user">Usuario</option>
</select>
<button onclick="login()">Entrar</button>
</div>

<div id="app" style="display:none">

<div class="card">
<h2>📚 Libros</h2>
<input id="book" placeholder="Libro">
<button onclick="addBook()">Agregar</button>
<div id="books"></div>
</div>

<div class="card">
<h2>📊 Estadísticas</h2>
<canvas id="chart"></canvas>
</div>

</div>

</div>

<script>
let books = JSON.parse(localStorage.getItem('books')) || [];
let role = '';

function toggleMode(){ document.body.classList.toggle('light'); }

function login(){
 role = document.getElementById('role').value;
 document.getElementById('app').style.display='block';
}

function save(){
 localStorage.setItem('books', JSON.stringify(books));
 render();
}

function addBook(){
 if(role !== 'admin') return alert('Solo admin');
 let name = document.getElementById('book').value;
 books.push({name});
 save();
}

function render(){
 let div = document.getElementById('books');
 div.innerHTML='';
 books.forEach(b=>{
  div.innerHTML += `<p>${b.name}</p>`;
 });

 new Chart(document.getElementById('chart'),{
  type:'bar',
  data:{labels:['Libros'],datasets:[{data:[books.length]}]}
 });
}

render();
</script>

</body>
</html>
