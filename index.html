<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POO - Jerónimo Zapata</title>

<!-- LIBRERÍAS -->

<script src="https://unpkg.com/feather-icons"></script>

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<style>
:root {
  --bg:#0f172a;
  --text:#e2e8f0;
  --primary:#38bdf8;
  --secondary:#facc15;
  --card:#1e293b;
}

body.light {
  --bg:#f4f6f9;
  --text:#1e293b;
  --card:#ffffff;
}

body {
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* PARTICLES */
#particles-js {
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

/* PROGRESS BAR */
#progress {
  position:fixed;
  top:0;
  left:0;
  height:5px;
  background:var(--primary);
  width:0%;
  z-index:2000;
}

/* NAV */
nav {
  position:fixed;
  width:100%;
  background:rgba(0,0,0,0.5);
  display:flex;
  justify-content:space-between;
  padding:10px;
  z-index:1000;
}

nav a {
  color:var(--primary);
  margin:10px;
  text-decoration:none;
  font-weight:bold;
}

/* HERO */
.hero {
  height:100vh;
  background:url("https://images.unsplash.com/photo-1518770660439-4636190af475") center/cover fixed;
  display:flex;
  justify-content:center;
  align-items:center;
}

.hero h1 {
  background:rgba(0,0,0,0.6);
  padding:20px;
  border-radius:10px;
  font-size:2.5rem;
}

/* SECCIONES */
section {
  padding:100px 20px;
  max-width:1000px;
  margin:auto;
}

h2 {
  text-align:center;
  color:var(--secondary);
}

/* CARDS */
.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
}

.card {
  background:var(--card);
  padding:20px;
  border-radius:10px;
  text-align:center;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.05);
}

/* CURSOR TRAIL */
.trail {
  width:6px;
  height:6px;
  background:var(--primary);
  border-radius:50%;
  position:fixed;
  pointer-events:none;
  z-index:3000;
}

/* CHAT */
.chatbox {
  position:fixed;
  bottom:20px;
  right:20px;
  width:250px;
  background:var(--card);
  border-radius:10px;
  overflow:hidden;
  z-index:4000;
}

.chat-header {
  background:var(--primary);
  padding:10px;
  text-align:center;
}

.chat-messages {
  height:150px;
  overflow-y:auto;
  padding:10px;
}

#chatInput {
  width:100%;
  border:none;
  padding:10px;
  outline:none;
}
</style>

</head>

<body>

<!-- FONDO -->

<div id="particles-js"></div>
<div id="progress"></div>

<!-- NAV -->

<nav>
  <div>
    <a href="#inicio">Inicio</a>
    <a href="#conceptos">Conceptos</a>
    <a href="#encapsulamiento">Encapsulamiento</a>
  </div>
  <button onclick="toggleTheme()">🌙</button>
</nav>

<!-- HERO -->

<section class="hero" id="inicio">
  <h1>🚀 Programación Orientada a Objetos</h1>
</section>

<!-- CONCEPTOS -->

<section id="conceptos">
  <h2>📊 Conceptos</h2>
  <div class="cards">
    <div class="card">Clases</div>
    <div class="card">Objetos</div>
    <div class="card">Métodos</div>
    <div class="card">Atributos</div>
  </div>
</section>

<!-- ENCAPSULAMIENTO -->

<section id="encapsulamiento">
  <h2>🔐 Encapsulamiento</h2>
  <div class="cards">
    <div class="card">Seguridad</div>
    <div class="card">Control</div>
    <div class="card">Modularidad</div>
  </div>
</section>

<!-- DASHBOARD -->

<section>
  <h2>📊 Dashboard</h2>
  <div class="cards">
    <div class="card">Temas: 8</div>
    <div class="card">Proyectos: 3</div>
    <div class="card">Nivel: Avanzado</div>
  </div>
</section>

<!-- CHAT IA -->

<div class="chatbox">
  <div class="chat-header">🤖 Asistente</div>
  <div class="chat-messages" id="chatMessages"></div>
  <input id="chatInput" placeholder="Escribe...">
</div>

<script>
// MODO CLARO/OSCURO
function toggleTheme(){
  document.body.classList.toggle("light");
}

// BARRA PROGRESO
window.onscroll=()=>{
  let s=document.documentElement.scrollTop;
  let h=document.documentElement.scrollHeight-document.documentElement.clientHeight;
  document.getElementById("progress").style.width=(s/h)*100+"%";
};

// PARTICULAS INTERACTIVAS
particlesJS("particles-js",{
  particles:{
    number:{value:80},
    size:{value:3},
    move:{speed:2}
  },
  interactivity:{
    events:{
      onhover:{enable:true,mode:"repulse"}
    },
    modes:{
      repulse:{distance:100}
    }
  }
});

// CURSOR TRAIL
const dots=[];
for(let i=0;i<12;i++){
  let d=document.createElement("div");
  d.className="trail";
  document.body.appendChild(d);
  dots.push({x:0,y:0,node:d});
}

let mouse={x:0,y:0};

document.addEventListener("mousemove",e=>{
  mouse.x=e.clientX;
  mouse.y=e.clientY;
});

function animate(){
  let x=mouse.x,y=mouse.y;
  dots.forEach(dot=>{
    dot.x+=(x-dot.x)*0.3;
    dot.y+=(y-dot.y)*0.3;
    dot.node.style.left=dot.x+"px";
    dot.node.style.top=dot.y+"px";
    x=dot.x;
    y=dot.y;
  });
  requestAnimationFrame(animate);
}
animate();

// CHAT IA SIMPLE
const input=document.getElementById("chatInput");
const messages=document.getElementById("chatMessages");

input.addEventListener("keypress",e=>{
  if(e.key==="Enter"){
    let txt=input.value;
    messages.innerHTML+=`<div>🧑 ${txt}</div>`;
    
    let r="🤖 ";
    if(txt.toLowerCase().includes("poo")){
      r+="La POO organiza el código en objetos.";
    }else if(txt.toLowerCase().includes("encapsulamiento")){
      r+="Protege los datos usando métodos.";
    }else{
      r+="Estoy aprendiendo contigo 😄";
    }

    messages.innerHTML+=`<div>${r}</div>`;
    input.value="";
  }
});
</script>

</body>
</html>
